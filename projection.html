<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こえ検索 投影</title>
<style>
  :root { --paper: #f6f3ee; --ink: #2b2620; --muted: #8a8375; --scale: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
  #stage { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #grid { flex: 1; min-height: 0; display: grid; gap: 1.6vh; padding: 2.4vh 2.4vw; }
  figure { margin: 0; min-height: 0; display: flex; flex-direction: column; background: #fff; border-radius: 1vh; overflow: hidden; }
  figure img { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #fff; }
  figcaption { font-size: 1.8vh; color: var(--muted); padding: 0.6vh 1vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #word { text-align: center; font-size: 6vh; font-weight: 700; padding: 0.4vh 0 1.6vh; }
  #word:empty { display: none; }
  #standby, #msg { margin: auto; text-align: center; }
  #standby h1 { font-size: 9vh; margin: 0 0 3vh; }
  #standby p, #msg { font-size: 2.6vh; color: var(--muted); line-height: 1.8; }
  #fsBtn { margin-top: 3vh; font-size: 2.6vh; padding: 1.4vh 3vw; border-radius: 999px; border: none; background: #4a7a68; color: #fff; cursor: pointer; }
  iframe { flex: 1; border: 0; width: 100%; background: #fff; }
  /* 写真・記事名・作者の行は、クリックで Wikipedia のページを新しいタブで開く */
  figure a { color: inherit; text-decoration: none; }
  figure a:hover { text-decoration: underline; }
  a.pic { flex: 1; min-height: 0; display: flex; }
  a.pic:hover { text-decoration: none; opacity: 0.88; }
  figcaption .lic { display: block; font-size: 1.4vh; color: #a39b8c; overflow: hidden; text-overflow: ellipsis; }
  #credit { text-align: right; font-size: 1.4vh; color: var(--muted); padding: 0 2.4vw 0.8vh; }
  #credit:empty { display: none; }

  /* 字幕（ルビ付き）。操作画面の設定で上・下を選べる */
  #bar { position: absolute; left: 0; right: 0; box-sizing: border-box; padding: 1.2vh 3vw; background: rgba(31, 28, 24, 0.92);
    color: #fff; font-weight: 600; font-size: calc(5.2vh * var(--scale)); display: none; z-index: 10; }
  #bar.on { display: block; }
  #bar.top { top: 0; } #bar.bottom { bottom: 0; }
  .line { white-space: nowrap; overflow: hidden; line-height: 1.75; min-height: 1.75em; }
  .line.old { color: #b8b0a3; }
  .interim { color: #8f877b; }
  ruby rt { font-size: 0.45em; font-weight: 500; color: #f3d9a4; }
  .line.old ruby rt { color: #a89a7c; }
  #measure { position: absolute; visibility: hidden; left: 0; top: 0; }
  /* スマートフォンの画面の中にはめ込むとき（embed=1） */
  body.embed #fsBtn { display: none; }
  body.embed #standby h1 { font-size: 7vh; }
  body.embed #standby p { font-size: 15px; padding: 0 16px; }
  body.embed #bar { font-size: calc(19px * var(--scale)); padding: 8px 14px; }
  body.embed figcaption { font-size: 11px; }
  body.embed figcaption .lic, body.embed #credit { font-size: 9px; }
  body.embed #word { font-size: 22px; }
  body.embed #grid { gap: 6px; padding: 8px; }
</style>
</head>
<body>
<div id="stage">
  <div id="standby">
    <h1>こえ検索</h1>
    <p>このウィンドウに、話に出てきた言葉の写真（Wikipedia）が表示されます。<br>
    話した言葉は、ルビ付きの字幕で表示されます。</p>
    <button id="fsBtn">クリックで全画面にする（F キー）</button>
  </div>
</div>
<div id="bar" class="bottom"><div class="line" id="measure"></div></div>
<script>
// 操作画面（index.html）から BroadcastChannel「koe-web」で指示が届く。
//   show  : { query, label, url? } → Wikipedia の画像を並べる（url があればそのページ）
//   final / interim : 字幕の文字 [[文字, ルビ], ...]
//   style : { scale, pos }   clear : 字幕を消す
const ch = new BroadcastChannel("koe-web");
const embed = new URLSearchParams(location.search).has("embed");
if (embed) document.body.classList.add("embed");
const stage = document.getElementById("stage");
const $ = (id) => document.getElementById(id);

// ---------- 全画面 ----------
// 投影ウィンドウはページが切り替わらないので、一度全画面にすれば講座中ずっとそのまま
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
}
$("fsBtn").onclick = toggleFullscreen;
document.addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") toggleFullscreen(); });

// ---------- Wikipedia の画像 ----------
const WIKI = "https://ja.wikipedia.org/w/api.php?format=json&origin=*&";
async function wikiJson(params) {
  const r = await fetch(WIKI + new URLSearchParams(params));
  return r.json();
}
// 受講者の方がつらくなりそうな写真（病気・けが・事故・戦争など）の記事は、写真に使わない。
// ただし、話している言葉そのものにその字が入っているとき（「失語症」など）は外さない
const NG_TITLE = ["梗塞", "卒中", "出血", "腫瘍", "癌", "がん", "病", "症候群", "障害", "損傷", "外傷", "骨折", "震盪", "挫傷", "麻痺", "発作", "感染", "手術", "死", "遺体", "解剖",
  "断層撮影", "磁気共鳴", "MRI", "CT", "画像診断", "事故", "事件", "戦争", "空襲", "原爆", "爆撃", "災害", "地震", "震災", "津波", "火災", "殺", "虐", "暴力", "テロ"];
// 記事の中の写真のファイル名（英語が多い）も同じように見る
// 「engraving」「Edward」などを外さないよう、短い語は単語として見る
const NG_FILE = /death|(?<![a-z])(dead|grave|war|wars|ct|mri)(?![a-z])|corpse|in_a_jar|dissect|cadaver|funeral|injur|wound|accident|disaster|bomb|surgery|autopsy|tomograph|stuffed|specimen|剥製|葬|墓/i;
const okTitle = (title, q) => !NG_TITLE.some((w) => title.includes(w) && !q.includes(w));

// 記事の中の写真（写真らしい jpg/png だけ。アイコンや旗の絵は外す）
// URL の後ろに「?utm_source=…」が付くので、拡張子はパスの部分で見る
async function articleImages(title) {
  const m = await wikiJson({ action: "query", titles: title, generator: "images", gimlimit: 40,
    prop: "imageinfo", iiprop: "url|size", iiurlwidth: 1200 });
  return Object.values(m.query?.pages || {})
    .map((f) => f.imageinfo?.[0])
    .filter((i) => i && /\.(jpe?g|png)$/i.test(new URL(i.url).pathname) && i.width >= 150 && i.height >= 150)
    .map((i) => ({ src: i.thumburl, cap: title }));
}

// 写真のない短い記事（「安藤士」など）は、その記事に出てくる言葉の記事の写真を出す。
// 長い記事は出てくる言葉が多すぎて関係の薄いものばかりになるので、検索の結果にまかせる
async function linkedImages(title) {
  const d = await wikiJson({ action: "query", titles: title, generator: "links", gplnamespace: 0, gpllimit: 50,
    prop: "pageimages", piprop: "thumbnail", pithumbsize: 1200, pilimit: 50 });
  if (d.continue) return [];
  return Object.values(d.query?.pages || {})
    .filter((p) => p.thumbnail && !/\.svg/i.test(p.thumbnail.source) && !/^\d|年|月|日$/.test(p.title))
    .map((p) => ({ src: p.thumbnail.source, cap: p.title }));
}

// 言葉そのものの記事（「脳」なら「脳」）を先に、そのあと検索に合う記事の「代表の写真」を並べる
// 単語リストの「=」の後ろが「安藤照 彫刻家 ハチ公」のように何語かあるときは、最初の言葉を記事の名前として探す
async function wikiImages(q, max = 6) {
  const head = q.trim().split(/[\s　]+/)[0];
  const [d, t] = await Promise.all([
    wikiJson({ action: "query", generator: "search", gsrsearch: q, gsrlimit: 12,
      prop: "pageimages", piprop: "thumbnail", pithumbsize: 1200, pilimit: 12, redirects: 1 }),
    // 記事の名前そのもので引く（「ハチ公」→ 転送で「忠犬ハチ公」）。曖昧さ回避のページは使わない
    wikiJson({ action: "query", titles: head, redirects: 1, prop: "pageimages|pageprops",
      piprop: "thumbnail", pithumbsize: 1200, ppprop: "disambiguation" }),
  ]);
  let pages = Object.values(d.query?.pages || {}).sort((a, b) => a.index - b.index).filter((p) => okTitle(p.title, q));
  const direct = Object.values(t.query?.pages || {})
    .find((p) => !("missing" in p) && !("invalid" in p) && !p.pageprops && okTitle(p.title, q));
  const exact = direct || pages.find((p) => norm(p.title) === norm(q) || norm(p.title) === norm(head));
  if (exact) pages = [exact, ...pages.filter((p) => p.title !== exact.title)];
  const out = [];
  const push = (im) => { if (out.length < max && !NG_FILE.test(fileName(im.src)) && !out.some((o) => fileName(o.src) === fileName(im.src))) out.push(im); };
  // いちばん合う記事（言葉そのものの記事、なければ検索の1番目。「ハチ公」→「忠犬ハチ公」）の写真を先に
  const main = exact || pages[0];
  if (main?.thumbnail) push({ src: main.thumbnail.source, cap: main.title });
  if (main) { try { (await articleImages(main.title)).filter((im) => okTitle(fileName(im.src), q)).slice(0, 4).forEach(push); } catch (e) {} }
  // 言葉そのものの記事に写真がないときは、その記事に出てくる言葉の写真（別の同じ名字の人より近い）
  if (exact && out.length === 0) { try { (await linkedImages(exact.title)).filter((im) => okTitle(im.cap, q)).forEach(push); } catch (e) {} }
  for (const p of pages) if (p.thumbnail) push({ src: p.thumbnail.source, cap: p.title });
  // 何も見つからず、ほかの言葉もあるときは、2つ目からの言葉で探し直す（「セラピーパテ リハビリ」→「リハビリ」）
  const rest = q.trim().split(/[\s　]+/).slice(1).join(" ");
  if (!out.length && rest) return wikiImages(rest, max);
  return out;
}
// 写真の作者とライセンス（Wikimedia Commons の写真は CC BY-SA などで、表示が必要）
// サムネイルの URL からファイル名を取り出し、まとめて問い合わせる
function fileName(src) {
  const parts = new URL(src).pathname.split("/");
  const i = parts.indexOf("thumb");
  return decodeURIComponent(i >= 0 ? parts[i + 3] : parts[parts.length - 1]);
}
const plain = (h) => (new DOMParser().parseFromString(h || "", "text/html").body.textContent || "").replace(/\((talk|トーク|会話)\)/gi, "").replace(/\s+/g, " ").trim();
async function credits(imgs) {
  const names = [...new Set(imgs.map((im) => fileName(im.src)))];
  const d = await wikiJson({ action: "query", titles: names.map((n) => "File:" + n).join("|"),
    prop: "imageinfo", iiprop: "extmetadata", iiextmetadatafilter: "Artist|Attribution|LicenseShortName" });
  const byName = {};
  for (const p of Object.values(d.query?.pages || {})) {
    const md = p.imageinfo?.[0]?.extmetadata || {};
    const who = plain(md.Attribution?.value) || plain(md.Artist?.value);
    const lic = plain(md.LicenseShortName?.value);
    byName[p.title.replace(/^[^:]+:/, "").replace(/ /g, "_")] = [who, lic].filter(Boolean).join(" / ");
  }
  for (const im of imgs) im.lic = byName[fileName(im.src).replace(/ /g, "_")] || "";
}
const norm = (t) => t.normalize("NFKC").replace(/[\s・･]/g, "").toLowerCase();

const WIKI_PAGE = "https://ja.wikipedia.org/wiki/";
function link(href, cls) {
  const a = document.createElement("a");
  a.href = href; a.target = "_blank"; a.rel = "noopener";
  if (cls) a.className = cls;
  return a;
}

let showSeq = 0;
async function show(m) {
  const seq = ++showSeq;
  if (m.url) {
    stage.innerHTML = `<iframe src="${encodeURI(m.url)}"></iframe>`;
    return;
  }
  let imgs = [];
  try { imgs = await wikiImages(m.query); } catch (e) {}
  try { await credits(imgs); } catch (e) {}
  if (seq !== showSeq) return;   // 待っている間に次の言葉が来た
  if (!imgs.length) {
    stage.innerHTML = `<div id="msg"></div><div id="word"></div>`;
    $("msg").textContent = `「${m.label}」の写真は Wikipedia に見つかりませんでした`;
    return;
  }
  const n = imgs.length, cols = n <= 1 ? 1 : n <= 4 ? 2 : 3;
  stage.innerHTML = `<div id="grid"></div><div id="word"></div><div id="credit"></div>`;
  const grid = $("grid");
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${Math.ceil(n / cols)}, 1fr)`;
  for (const im of imgs) {
    const f = document.createElement("figure");
    const article = WIKI_PAGE + encodeURIComponent(im.cap);
    const pic = link(article, "pic");
    const img = document.createElement("img");
    img.src = im.src; img.alt = im.cap;
    pic.title = `「${im.cap}」の記事を開く`;
    pic.appendChild(img);
    const c = document.createElement("figcaption");
    const name = link(article);
    name.textContent = im.cap;
    // 作者の行は、写真そのもののページ（作者・ライセンスがくわしく載っている）へ
    const lic = link(WIKI_PAGE + encodeURIComponent("File:" + fileName(im.src)), "lic");
    lic.textContent = "写真：" + (im.lic || "作者・ライセンスは Wikimedia Commons の各ページ");
    lic.title = "この写真の作者・ライセンスのページを開く";
    c.append(name, lic);
    f.append(pic, c);
    grid.appendChild(f);
  }
  $("word").textContent = m.label;
  $("credit").textContent = "写真：Wikipedia / Wikimedia Commons より（各写真の下に 作者 / ライセンス）";
}

// ---------- 字幕（ルビ付き） ----------
const LINE_SECONDS = 10;   // 1行を使う時間。これを過ぎて話が続いたら次の行へ
let lines = [], interim = [];
const bar = $("bar"), measureEl = $("measure");
// 字幕の行数。スマートフォンは画面が細く1行に入る文字が少ないので4行
const SHOW_LINES = embed ? 4 : 2;
const lineEls = Array.from({ length: SHOW_LINES }, () => {
  const el = document.createElement("div");
  el.className = "line";
  bar.insertBefore(el, measureEl);
  return el;
});

function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function html(tokens, cls) {
  const inner = tokens.map(([s, r]) => (r ? `<ruby>${esc(s)}<rt>${esc(r)}</rt></ruby>` : esc(s))).join("");
  return cls ? `<span class="${cls}">${inner}</span>` : inner;
}
function fits(tokens) {
  const was = bar.classList.contains("on");
  bar.classList.add("on");
  measureEl.innerHTML = html(tokens);
  const cs = getComputedStyle(bar);
  const ok = measureEl.scrollWidth <= bar.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  if (!was) bar.classList.remove("on");
  return ok;
}
function place(target, tokens, now) {
  for (const t of tokens) {
    let cur = target[target.length - 1];
    const tooOld = !cur || now - cur.at > LINE_SECONDS * 1000;
    const full = cur && cur.tokens.length > 0 && !fits([...cur.tokens, t]);
    if (tooOld || full) {
      if (cur && cur.tokens.length === 0) cur.at = now;
      else { cur = { at: now, tokens: [] }; target.push(cur); }
    }
    if (cur.tokens.length === 0 && /^\s+$/.test(t[0])) continue;
    if (cur.tokens.length === 0 && /^[、。，．,.!?！？」』）]+$/.test(t[0])) {
      const prev = target[target.length - 2];
      if (prev) prev.tokens.push(t);
      continue;
    }
    cur.tokens.push(t);
  }
}
function render() {
  const now = Date.now();
  const view = lines.map((l) => ({ at: l.at, tokens: l.tokens.map((t) => [...t, false]) }));
  if (interim.length) place(view, [["　", "", true], ...interim.map((t) => [...t, true])], now);
  const shown = view.slice(-SHOW_LINES);
  lineEls.forEach((el, i) => {
    const l = shown[i];
    if (!l) { el.innerHTML = ""; el.classList.remove("old"); return; }
    let out = "", buf = [], mode = null;
    const flush = () => { if (buf.length) out += html(buf, mode ? "interim" : ""); buf = []; };
    for (const t of l.tokens) { if (t[2] !== mode) { flush(); mode = t[2]; } buf.push(t); }
    flush();
    el.innerHTML = out;
    el.classList.toggle("old", i < shown.length - 1);   // いちばん新しい行以外は少し暗く
  });
  bar.classList.toggle("on", view.length > 0);
  // 写真が字幕に隠れないよう、字幕の分だけ空けて並べる
  const h = bar.classList.contains("on") ? bar.offsetHeight : 0;
  stage.style.top = bar.classList.contains("top") ? h + "px" : "0";
  stage.style.bottom = bar.classList.contains("top") ? "0" : h + "px";
}

ch.onmessage = (e) => {
  const m = e.data || {};
  if (m.type === "show") return show(m);
  if (m.type === "final") { interim = []; place(lines, [["　", ""], ...m.tokens], Date.now()); if (lines.length > 8) lines = lines.slice(-8); }
  else if (m.type === "interim") interim = m.tokens || [];
  else if (m.type === "clear") { lines = []; interim = []; }
  else if (m.type === "style") {
    document.documentElement.style.setProperty("--scale", m.scale || 1);
    bar.classList.toggle("top", m.pos === "top");
    bar.classList.toggle("bottom", m.pos !== "top");
  }
  render();
};
ch.postMessage({ type: "hello" });   // 開いたら、操作画面に字幕の大きさ・位置を聞く
window.addEventListener("resize", render);
</script>
</body>
</html>
